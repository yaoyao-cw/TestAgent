# TestAgent 开发环境 Docker Compose 配置
version: '3.8'

services:
  # TestAgent 开发应用
  testagent-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: testagent-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9090:9090"  # 监控端口
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=true
      - REDIS_URL=redis://redis-dev:6379/0
      - VECTOR_DB_PATH=/app/data/vectordb
      - LOG_FILE=/app/logs/testagent.log
    volumes:
      # 挂载源代码以支持热重载
      - .:/app
      - testagent_dev_data:/app/data
      - testagent_dev_logs:/app/logs
      - testagent_dev_config:/app/config
    depends_on:
      - redis-dev
      - chroma-dev
    networks:
      - testagent-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis 开发环境
  redis-dev:
    image: redis:7-alpine
    container_name: testagent-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"  # 避免与生产环境冲突
    volumes:
      - redis_dev_data:/data
    networks:
      - testagent-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: redis-server --appendonly yes

  # ChromaDB 开发环境
  chroma-dev:
    image: chromadb/chroma:latest
    container_name: testagent-chroma-dev
    restart: unless-stopped
    ports:
      - "8002:8000"  # 避免与生产环境冲突
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    volumes:
      - chroma_dev_data:/chroma/chroma
    networks:
      - testagent-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 开发工具容器
  dev-tools:
    image: python:3.11-slim
    container_name: testagent-dev-tools
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - testagent-dev-network
    command: tail -f /dev/null  # 保持容器运行
    profiles:
      - tools  # 可选服务，需要明确启动

# 网络配置
networks:
  testagent-dev-network:
    driver: bridge

# 数据卷配置
volumes:
  testagent_dev_data:
    driver: local
  testagent_dev_logs:
    driver: local
  testagent_dev_config:
    driver: local
  redis_dev_data:
    driver: local
  chroma_dev_data:
    driver: local