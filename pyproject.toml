[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "testagent"
version = "0.1.0"
description = "TestAgent - 智能测试代理系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangChain and LangGraph
    "langchain>=0.3.19",
    "langchain-community>=0.3.19",
    "langchain-openai>=0.3.8",
    "langgraph>=0.3.5",
    
    # LLM Integration
    "litellm>=1.63.11",
    "openai>=1.0.0",
    
    # Multiple LLM Providers
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    
    # RAG and Vector Database
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    
    # MCP Integration
    "mcp>=1.6.0",
    "langchain-mcp-adapters>=0.0.9",
    "aiohttp-sse-client>=0.2.1",
    
    # Web Framework
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "sse-starlette>=1.6.5",
    
    # Utilities
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.3",
    "json-repair>=0.7.0",
    "markdownify>=1.1.0",
    
    # Development
    "inquirerpy>=0.3.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=24.2.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "langgraph-cli[inmem]>=0.2.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]